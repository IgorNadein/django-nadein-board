[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-nadein-board"
version = "0.2.0"
description = "Standalone Django task boards with an embeddable React interface"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Igor Nadein"}]
dependencies = ["Django>=5.2,<6.0", "djangorestframework>=3.16,<4", "Pillow>=11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nadein_board = ["templates/nadein_board/*.html", "static/nadein_board/*"]
